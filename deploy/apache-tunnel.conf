# =====================================================================
# FacePass - Apache protection for online access via a tunnel (ngrok / Cloudflare)
#
# Requests that arrive through the tunnel come from 127.0.0.1, so XAMPP's
# "Require local" would let internet visitors into phpMyAdmin (MySQL root,
# no password) and other XAMPP tools. Tunnels add forwarding headers
# (Cloudflare: CF-Connecting-IP / CF-Ray, ngrok: X-Forwarded-For /
# X-Forwarded-Host) to every tunnelled request, so we refuse those requests
# for the XAMPP tools. Local use (http://localhost/phpmyadmin) still works.
#
# Install: copy to C:\xampp\apache\conf\extra\httpd-facepass-tunnel.conf
# and add this line at the end of C:\xampp\apache\conf\httpd.conf:
#     IncludeOptional "conf/extra/httpd-facepass-tunnel.conf"
# Then restart Apache.
# =====================================================================

<IfModule rewrite_module>
    RewriteEngine On
    RewriteCond %{HTTP:CF-Connecting-IP} !^$ [OR]
    RewriteCond %{HTTP:CF-Ray} !^$ [OR]
    RewriteCond %{HTTP:X-Forwarded-For} !^$ [OR]
    RewriteCond %{HTTP:X-Forwarded-Host} !^$
    RewriteRule ^/(phpmyadmin|webalizer|licenses|php-cgi|server-status|server-info|xampp|dashboard)(/|$) - [F,NC]
</IfModule>

# Do not advertise Apache/PHP versions to the internet.
ServerTokens Prod
ServerSignature Off
